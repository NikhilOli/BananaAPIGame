<!doctype html>
<html>
<head>
  <meta charset="utf-8"/>
  <title>Profile - Banana Game</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="stylesheet" href="styles.css" />

  <!-- Profile specific small tweaks -->
  <style>
    .profile-card {
      width: 520px;
      max-width: 96%;
      text-align: left;
    }
    .profile-header-row {
      display:flex;
      align-items:center;
      gap:14px;
      margin-bottom:10px;
    }
    .avatar {
      width:56px;
      height:56px;
      border-radius:50%;
      background: linear-gradient(135deg,#ffdd57,#ff9f1c);
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:1.4rem;
      font-weight:800;
      color:#102020;
      box-shadow:0 8px 18px rgba(255,159,28,0.25);
    }
    .profile-name {
      font-size:1.15rem;
      font-weight:700;
      color:#fff;
    }
    .profile-email {
      font-size:0.92rem;
      color:rgba(220,236,255,0.8);
    }
    .profile-meta {
      font-size:0.85rem;
      color:rgba(220,236,255,0.7);
      margin-top:4px;
    }
    .stats-grid {
      margin-top:16px;
      display:grid;
      grid-template-columns: repeat(2, minmax(0,1fr));
      gap:10px;
    }
    .stat-card {
      padding:10px 12px;
      border-radius:10px;
      background:rgba(255,255,255,0.03);
      border:1px solid rgba(255,255,255,0.06);
      text-align:left;
    }
    .stat-label {
      font-size:0.8rem;
      color:rgba(220,236,255,0.75);
      text-transform:uppercase;
      letter-spacing:0.04em;
    }
    .stat-value {
      margin-top:4px;
      font-size:1.1rem;
      font-weight:700;
      color:#ffdd57;
    }
    .recent-list {
      margin-top:16px;
      border-top:1px solid rgba(255,255,255,0.06);
      padding-top:12px;
    }
    .recent-item {
      font-size:0.9rem;
      color:rgba(220,236,255,0.85);
      margin-bottom:6px;
    }
    .recent-empty {
      font-size:0.9rem;
      color:rgba(220,236,255,0.6);
    }
    .profile-actions {
      margin-top:16px;
      display:flex;
      flex-wrap:wrap;
      gap:10px;
    }
    .profile-actions .btn {
      flex:1;
      min-width:120px;
    }
    .profile-status {
      margin-top:10px;
      font-size:0.85rem;
      color:rgba(220,236,255,0.7);
      min-height:18px;
    }

    @media (max-width:600px) {
      .profile-card { width:94%; }
      .stats-grid { grid-template-columns:1fr; }
      .profile-header-row { align-items:flex-start; }
    }
  </style>
</head>
<body>
  <!-- NAVBAR (same as other pages) -->
  <header class="site-header">
    <div class="site-header-inner">
      <a class="brand" href="index.html">🍌 Banana Game</a>
      <nav class="nav">
        <a class="nav-link" href="index.html">Home</a>
        <a class="nav-link" href="play.html">Play</a>
        <a class="nav-link" href="profile.html">Profile</a>
        <a id="navAuthBtn" class="nav-link" href="login.html">Sign in</a>
      </nav>
      <button class="hamburger" aria-label="Open menu">☰</button>
    </div>
    <div class="mobile-menu" data-visible="false">
      <a class="mobile-link" href="index.html">Home</a>
      <a class="mobile-link" href="play.html">Play</a>
      <a class="mobile-link" href="profile.html">Profile</a>
      <a id="mobileAuthBtn" class="mobile-link" href="login.html">Sign in</a>
    </div>
  </header>

  <div class="center-wrap">
    <div class="card profile-card">
      <div class="profile-header-row">
        <div class="avatar" id="avatarInitial">?</div>
        <div>
          <div class="profile-name" id="profileName">Loading...</div>
          <div class="profile-email" id="profileEmail"></div>
          <div class="profile-meta" id="profileMeta"></div>
        </div>
      </div>

      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-label">Total Score</div>
          <div class="stat-value" id="totalScoreDisplay">—</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Games Played</div>
          <div class="stat-value" id="gamesPlayedDisplay">—</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Last Active</div>
          <div class="stat-value" id="lastActiveDisplay">—</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Joined</div>
          <div class="stat-value" id="joinedDisplay">—</div>
        </div>
      </div>

      <div class="recent-list">
        <div class="stat-label" style="margin-bottom:4px;">Recent Scores</div>
        <div id="recentScores">
          <div class="recent-empty">No games yet. Play a round to see your history here.</div>
        </div>
      </div>

      <div class="profile-actions">
        <a href="play.html" class="btn primary">🎮 Play a game</a>
        <button id="profileSignOutBtn" class="btn ghost">Sign out</button>
      </div>

      <div id="profileStatus" class="profile-status"></div>

      <div class="foot small muted">Profile page – showing virtual identity and stored progress for this user.</div>
    </div>
  </div>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>

  <script src="firebase-config.js"></script>

  <script>
    (function () {
      const nameEl = document.getElementById('profileName');
      const emailEl = document.getElementById('profileEmail');
      const metaEl = document.getElementById('profileMeta');
      const avatarEl = document.getElementById('avatarInitial');
      const totalScoreEl = document.getElementById('totalScoreDisplay');
      const gamesPlayedEl = document.getElementById('gamesPlayedDisplay');
      const lastActiveEl = document.getElementById('lastActiveDisplay');
      const joinedEl = document.getElementById('joinedDisplay');
      const recentScoresEl = document.getElementById('recentScores');
      const statusEl = document.getElementById('profileStatus');
      const signOutBtn = document.getElementById('profileSignOutBtn');

      if (typeof firebaseConfig === 'undefined') {
        nameEl.textContent = 'Firebase not configured';
        statusEl.textContent = 'Please create firebase-config.js (not in repo) for this to work locally.';
        return;
      }

      firebase.initializeApp(firebaseConfig);
      const auth = firebase.auth();
      const db = firebase.firestore();

      auth.onAuthStateChanged(async (user) => {
        if (!user) {
          nameEl.textContent = 'Not signed in';
          emailEl.textContent = '';
          metaEl.textContent = '';
          totalScoreEl.textContent = '—';
          gamesPlayedEl.textContent = '—';
          lastActiveEl.textContent = '—';
          joinedEl.textContent = '—';
          recentScoresEl.innerHTML = '<div class="recent-empty">Please sign in to view your profile.</div>';
          statusEl.textContent = 'Redirecting to login page...';
          setTimeout(() => { location.href = 'login.html'; }, 1500);
          return;
        }

        // basic info
        const displayName = user.displayName || '';
        const email = user.email || '';
        nameEl.textContent = displayName || email || 'Player';
        emailEl.textContent = email;
        avatarEl.textContent = (displayName || email || 'P').charAt(0).toUpperCase();
        metaEl.textContent = `User ID: ${user.uid.slice(0, 8)}…`;

        // sign-out button
        signOutBtn.onclick = async () => {
          try {
            await auth.signOut();
            location.href = 'index.html';
          } catch (e) {
            statusEl.textContent = 'Error signing out: ' + e.message;
          }
        };

        statusEl.textContent = 'Loading your stats…';

        // load user doc
        try {
          const docSnap = await db.collection('users').doc(user.uid).get();
          if (docSnap.exists) {
            const data = docSnap.data();
            totalScoreEl.textContent = data.totalScore ?? 0;
            gamesPlayedEl.textContent = data.gamesPlayed ?? 0;

            if (data.lastActive && data.lastActive.toDate) {
              lastActiveEl.textContent = formatDateTime(data.lastActive.toDate());
            } else {
              lastActiveEl.textContent = '—';
            }
            if (data.createdAt && data.createdAt.toDate) {
              joinedEl.textContent = formatDate(data.createdAt.toDate());
            } else {
              joinedEl.textContent = '—';
            }
          } else {
            totalScoreEl.textContent = 0;
            gamesPlayedEl.textContent = 0;
            lastActiveEl.textContent = '—';
            joinedEl.textContent = '—';
          }
        } catch (e) {
          console.warn('Could not load user doc', e);
          statusEl.textContent = 'Error loading profile data.';
        }

        // load recent scores (last 5)
        try {
          const snap = await db.collection('scores')
            .where('uid', '==', user.uid)
            .orderBy('createdAt', 'desc')
            .limit(5)
            .get();

          if (snap.empty) {
            recentScoresEl.innerHTML = '<div class="recent-empty">No games yet. Play a round to see your history here.</div>';
          } else {
            let html = '';
            snap.forEach(doc => {
              const d = doc.data();
              const s = d.score ?? 0;
              let when = '';
              if (d.createdAt && d.createdAt.toDate) {
                when = formatDateTime(d.createdAt.toDate());
              }
              html += `<div class="recent-item">+${s} points — <span style="opacity:0.8">${when}</span></div>`;
            });
            recentScoresEl.innerHTML = html;
          }
        } catch (e) {
          console.warn('Could not load recent scores', e);
          recentScoresEl.innerHTML = '<div class="recent-empty">Could not load recent scores.</div>';
        }

        statusEl.textContent = '';
      });

      function formatDateTime(d) {
        try {
          return d.toLocaleString(undefined, {
            year:'numeric', month:'short', day:'2-digit',
            hour:'2-digit', minute:'2-digit'
          });
        } catch {
          return d.toString();
        }
      }
      function formatDate(d) {
        try {
          return d.toLocaleDateString(undefined, {
            year:'numeric', month:'short', day:'2-digit'
          });
        } catch {
          return d.toDateString();
        }
      }
    })();
  </script>

  <!-- navbar behaviour (mobile + auth button text) -->
  <script src="navbar.js"></script>
</body>
</html>
