<!doctype html>
<html>
<head>
  <meta charset="utf-8"/>
  <title>Sign In - Banana Quiz</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="site-header-inner">
      <a class="brand" href="index.html">🍌 Banana Game</a>
      <nav class="nav">
        <a class="nav-link" href="index.html">Home</a>
        <a class="nav-link" href="play.html">Play</a>
        <a class="nav-link" href="profile.html">Profile</a>
        <a class="nav-link" href="leaderboard.html">Leaderboard</a>
        <a id="navAuthBtn" class="nav-link" href="login.html">Sign in</a>
      </nav>
      <button class="hamburger" aria-label="Open menu">☰</button>
    </div>
    <div class="mobile-menu" aria-hidden="true">
      <a class="mobile-link" href="index.html">Home</a>
      <a class="mobile-link" href="play.html">Play</a>
      <a class="mobile-link" href="profile.html">Profile</a>
      <a class="mobile-link" href="leaderboard.html">Leaderboard</a>
      <a id="mobileAuthBtn" class="mobile-link" href="login.html">Sign in</a>
    </div>
  </header>
  <div class="center-wrap">
    <div class="card auth-card">
      <div class="logo-row">
        <div class="logo">🍌</div>
        <h1 class="title">Sign in</h1>
      </div>

      <p class="lead">Sign in to save your scores and view your profile.</p>

      <label>Email
        <input id="email" type="email" placeholder="you@example.com" />
      </label>

      <label>Password
        <input id="password" type="password" placeholder="Your password" />
      </label>

      <div class="btn-row">
        <button id="loginBtn" class="btn primary">Sign in</button>
        <a class="btn ghost" href="register.html">Create account</a>
      </div>

      <div style="margin-top:12px;">
        <button id="guestBtn" class="btn ghost">Continue as Guest</button>
      </div>

      <p id="msg" class="small muted"></p>

      <div class="foot small muted">Forgot password? For now, use the guest option to try the game.</div>
    </div>
  </div>

  <!-- Firebase CDN -->
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>

  <script src="firebase-config.js"></script>
  <script>
    if (typeof firebaseConfig === 'undefined') {
      document.getElementById('msg').textContent = 'Firebase not configured. Copy firebase-config.example.js to firebase-config.js';
      console.warn('firebaseConfig missing');
    } else {
      firebase.initializeApp(firebaseConfig);
      const auth = firebase.auth();
      const db = firebase.firestore();

      document.getElementById('loginBtn').addEventListener('click', async () => {
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value.trim();
        const msg = document.getElementById('msg');
        msg.textContent = '';
        if (!email || !password) { msg.textContent = 'Enter email and password'; return; }
        try {
          const res = await auth.signInWithEmailAndPassword(email, password);

          // update or create user doc with lastActive
          await db.collection('users').doc(res.user.uid).set({
            email: res.user.email,
            lastActive: firebase.firestore.FieldValue.serverTimestamp()
          }, { merge: true });

          // redirect to play page
          location.href = 'play.html';
        } catch (e) {
          console.error(e);
          msg.textContent = 'Sign-in error: ' + e.message;
        }
      });

      // Anonymous guest sign-in
      document.getElementById('guestBtn').addEventListener('click', async () => {
        const msg = document.getElementById('msg');
        msg.textContent = '';
        try {
          const res = await auth.signInAnonymously();

          // ensure a user doc exists for anonymous user with minimal info
          await db.collection('users').doc(res.user.uid).set({
            name: 'Guest',
            email: null,
            totalScore: 0,
            gamesPlayed: 0,
            createdAt: firebase.firestore.FieldValue.serverTimestamp(),
            lastActive: firebase.firestore.FieldValue.serverTimestamp()
          }, { merge: true });

          location.href = 'play.html';
        } catch (e) {
          console.error(e);
          msg.textContent = 'Guest sign-in failed: ' + e.message;
        }
      });
    }
  </script>
  <script src="navbar.js"></script>
</body>
</html>
