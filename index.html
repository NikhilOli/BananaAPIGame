<!doctype html>
<html>
<head>
  <meta charset="utf-8"/>
  <title>Banana Quiz - Home</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="center-wrap">
    <div class="card">
      <div class="logo-row">
        <div class="logo">🍌</div>
        <h1 class="title">Banana Quiz</h1>
      </div>

      <div id="greeting" class="header-small">Loading…</div>

      <p class="lead" id="leadText">Fun quiz prototype — play to earn points and save your progress.</p>

      <div class="btn-row">
        <a class="btn primary" id="playBtn" href="play.html">Play Quiz</a>
        <a class="btn ghost" id="loginBtn" href="login.html">Sign in</a>
      </div>

      <div id="userBadge" style="margin-top:14px;"></div>

      <div class="foot small muted">Demo app for university assignment — auth via Firebase.</div>
    </div>
  </div>

  <!-- Firebase CDN -->
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>

  <script src="firebase-config.js"></script>
  <script>
    // initialize firebase
    if (typeof firebaseConfig === 'undefined') {
      document.getElementById('greeting').textContent = 'Firebase not configured. Copy firebase-config.example.js to firebase-config.js';
      console.warn('firebaseConfig is missing. Create firebase-config.js locally.');
    } else {
      firebase.initializeApp(firebaseConfig);
      const auth = firebase.auth();
      const db = firebase.firestore();

      // update UI based on auth state
      auth.onAuthStateChanged(async (user) => {
        const greeting = document.getElementById('greeting');
        const userBadge = document.getElementById('userBadge');
        const loginBtn = document.getElementById('loginBtn');
        const playBtn = document.getElementById('playBtn');

        if (user) {
          // try to get displayName, otherwise read from Firestore user doc
          let displayName = user.displayName || '';
          if (!displayName) {
            try {
              const doc = await db.collection('users').doc(user.uid).get();
              if (doc.exists && doc.data().name) displayName = doc.data().name;
            } catch (e) { console.warn('Could not read name from Firestore', e); }
          }

          greeting.textContent = `Welcome back, ${displayName || user.email || 'Player'}!`;
          userBadge.innerHTML = `<div class="badge">${displayName || user.email || user.uid}</div>`;
          loginBtn.textContent = 'Sign out';
          loginBtn.href = '#';
          loginBtn.addEventListener('click', async (ev) => {
            ev.preventDefault();
            await auth.signOut();
            location.reload();
          });

          // update lastActive
          try {
            await db.collection('users').doc(user.uid).set({
              lastActive: firebase.firestore.FieldValue.serverTimestamp()
            }, { merge: true });
          } catch (e) { console.warn('Could not update lastActive', e); }
        } else {
          greeting.textContent = 'Welcome — sign in or play as guest.';
          userBadge.innerHTML = '';
          loginBtn.textContent = 'Sign in';
          loginBtn.href = 'login.html';
        }
      });
    }
  </script>
</body>
</html>
